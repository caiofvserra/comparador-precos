services:
  - type: web
    name: comparador-precos-web
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: BOOTSTRAP_SAVEGNAGO
        value: "false"
      # Apenas a apresentação do Render prioriza produtos com preços em 3 redes.
      # Os importadores e os endpoints continuam com suporte ao catálogo completo.
      - key: CATALOGO_MODO
        value: "triangulacao"
      - key: DATABASE_URL
        fromDatabase:
          name: comparador-precos-db-caio
          property: connectionString

databases:
  - name: comparador-precos-db-caio
    plan: free
    region: virginia
    databaseName: comparador
    user: comparador
    postgresMajorVersion: "18"
